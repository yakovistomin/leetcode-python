version: 2

updates:
  - package-ecosystem: uv
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Makassar
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Makassar
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
