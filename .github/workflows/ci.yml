name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ruff
            run: |
              status=0
              uv run ruff check . || status=1
              uv run ruff format --check . || status=1
              exit "$status"
          - name: Mypy
            run: uv run mypy .
          - name: Tests
            run: uv run pytest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}
