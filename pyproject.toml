[project]
name = "leetcode-python"
version = "0.1.0"
description = "Leetcode problem solutions"
readme = "README.md"
authors = [{ name = "Yakov Istomin", email = "yakov@istomin.me" }]
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.170.11",
    "ipython>=9.17.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py315"
src = [".", "solutions"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["CPY001", "D1", "EM101", "TRY003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"solutions/**" = ["N802"]
"tests/**" = ["N802", "S101", "PLR2004", "S101"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2
known-first-party = ["solutions"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.mypy]
python_version = "3.15"
strict = true
warn_unreachable = true
pretty = true
exclude = ["^\\.venv/", "^build/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
