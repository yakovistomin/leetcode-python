[project]
name = "python-leetcode"
version = "0.1.0"
description = "Leetcode problem solutions"
readme = "README.md"
authors = [{ name = "Yakov Istomin", email = "yakov@istomin.me" }]
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py315"
src = [".", "leetcode"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ARG001", "CPY001", "COM812", "D1", "E501", "N802", "TRY003", "EM101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "S101"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2
known-first-party = ["leetcode"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.mypy]
python_version = "3.15"
strict = true
warn_unreachable = true
pretty = true
exclude = ["^\\.venv/", "^build/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
